<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Organiseur de tâches basé sur la matrice d'Eisenhower : priorisez selon l'urgence et l'importance." />
  <title>Matrice d'Eisenhower — Organiseur de tâches</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='45' height='45' x='3' y='3' rx='8' fill='%23e5484d'/%3E%3Crect width='45' height='45' x='52' y='3' rx='8' fill='%233b82f6'/%3E%3Crect width='45' height='45' x='3' y='52' rx='8' fill='%23f5a623'/%3E%3Crect width='45' height='45' x='52' y='52' rx='8' fill='%23808080'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <h1 class="app-title">Matrice d'Eisenhower</h1>
      <p class="app-subtitle">Priorisez vos tâches selon leur urgence et leur importance.</p>
    </div>
    <div class="app-toolbar">
      <form id="add-form" class="add-form" autocomplete="off">
        <input
          id="task-input"
          class="add-form__input"
          type="text"
          placeholder="Nouvelle tâche…"
          aria-label="Intitulé de la tâche"
          maxlength="200"
          required
        />
        <select id="quadrant-select" class="add-form__select" aria-label="Quadrant de destination">
          <option value="q1">Urgent &amp; Important</option>
          <option value="q2">Important, pas urgent</option>
          <option value="q3">Urgent, pas important</option>
          <option value="q4">Ni urgent ni important</option>
        </select>
        <button type="submit" class="btn btn--primary">Ajouter</button>
      </form>
    </div>
  </header>

  <main class="matrix" id="matrix" aria-label="Matrice d'Eisenhower">
    <!-- Les quadrants sont générés par app.js -->
  </main>

  <footer class="app-footer">
    <div class="stats" id="stats" aria-live="polite"></div>
    <button type="button" class="btn btn--ghost" id="clear-done">Effacer les tâches terminées</button>
  </footer>

  <div id="drag-ghost" class="drag-ghost" aria-hidden="true"></div>

  <script src="app.js"></script>
</body>
</html>
